<style>
@import url("https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap");
:root{color-scheme:dark;--leather:#1f3a2b;--leather-hi:#2c5039;--paper:#f3ead3;--ink:#2b2a22;--gold:#c9a24a;--gold-hi:#ecc874;--cyan:#3fd6c8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a120d;overflow:hidden}
main{position:relative;height:100dvh;color:var(--paper)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%}
/* 左邊暗下來，字才站得住 */
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,8,.82) 0%,rgba(6,12,8,.55) 38%,rgba(6,12,8,0) 62%)}
/* 書封是生圖做的綠皮燙金封面（docs/larch/ui/book.webp），字排在燙金框裡的空白處 */
.book{position:absolute;left:clamp(16px,7vw,130px);top:50%;transform:translateY(-50%);container-type:inline-size;
  width:min(560px,84vw,calc(84dvh * 663 / 900));aspect-ratio:663/900;filter:drop-shadow(0 24px 40px rgba(0,0,0,.65))}
.book>img{position:absolute;inset:0;width:100%;height:100%}
.inner{position:absolute;left:20%;right:18%;top:27%;bottom:9%;display:flex;flex-direction:column}
h1{margin:0 0 6cqw;white-space:nowrap;font-size:7.6cqw;line-height:1.25;color:#f0cf7c;letter-spacing:.06em;font-weight:700;
  text-shadow:0 1px 0 rgba(255,240,200,.35),0 -1px 0 rgba(0,0,0,.6),0 3px 6px rgba(0,0,0,.45)}
p{margin:0 0 auto;color:#efe6cc;font-size:3.3cqw;line-height:1.8;text-shadow:0 1px 2px rgba(0,0,0,.5)}
nav{display:flex;flex-direction:column;gap:2.4cqw;width:100%}
button{font:inherit;font-size:3.5cqw;letter-spacing:.18em;padding:2.2cqw 3cqw;border-radius:1.6cqw;cursor:pointer;
  color:var(--paper);background:rgba(10,24,16,.35);border:1px solid rgba(236,200,116,.55);transition:background .15s,border-color .15s,color .15s}
button[data-larch-action="start"]{color:#1b2a1e;background:linear-gradient(180deg,#f4d98f,#c9a24a);border-color:#f4d98f;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 6px rgba(0,0,0,.4)}
button:hover,button:focus-visible{outline:none;border-color:var(--gold-hi);background:rgba(236,200,116,.16);color:var(--gold-hi)}
button[data-larch-action="start"]:hover,button[data-larch-action="start"]:focus-visible{background:#f4d88e;color:var(--leather)}
button:focus-visible{box-shadow:0 0 0 3px var(--cyan)}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
button[hidden]{display:none}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 10px 3px rgba(236,200,116,.7);opacity:0;animation:fly var(--d) ease-in-out var(--w) infinite}
@keyframes fly{0%,100%{opacity:0;transform:translate(0,0)}30%,70%{opacity:.9}50%{transform:translate(var(--x),var(--y))}}
@media (max-width:720px){.shade{background:linear-gradient(0deg,rgba(6,12,8,.88) 0%,rgba(6,12,8,.5) 55%,rgba(6,12,8,.1) 100%)}
  .book{top:auto;bottom:16px;transform:none;left:0;right:0;margin:0 auto;width:min(78vw,calc(58dvh * 663 / 900))}.art{object-position:72% 50%}}
@media (prefers-reduced-motion:reduce){.fly{display:none}button{transition:none}}
/* 播放器會替標題套專案字型，這裡換成跟月曆、日記頁一樣的霞鶩文楷 */
html{--larch-project-font:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif!important}
</style>
<main>
  <img class="art" data-larch-slot="cover" alt="">
  <div class="shade"></div>
  <div id="flies" aria-hidden="true"></div>
  <section class="book">
    <img src="https://yazelin.github.io/yori-growth-log/larch/ui/book.webp" alt="">
    <div class="inner">
    <h1 data-larch-slot="title"></h1>
    <p data-larch-slot="description"></p>
    <nav aria-label="遊戲選單">
      <button data-larch-action="start">翻開日記</button>
      <button data-larch-action="gallery">插畫收藏</button>
    </nav>
    </div>
  </section>
</main>
<script>
// 螢火蟲：位置與節奏每次打開都不一樣
var box = document.getElementById('flies');
for (var i = 0; i < 18; i++) {
  var f = document.createElement('i'), r = Math.random;
  f.className = 'fly';
  f.style.cssText = 'left:' + (r() * 100) + '%;top:' + (15 + r() * 75) + '%;--d:' + (5 + r() * 6) + 's;--w:' + (-r() * 8) + 's;--x:' + (r() * 80 - 40) + 'px;--y:' + (r() * 60 - 40) + 'px';
  box.appendChild(f);
}
</script>
