name: 優理每日日記

on:
  schedule:
    - cron: '30 13 * * *'   # 台北 21:30 每天一篇
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-entry
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: 確認金鑰
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::缺 GEMINI_API_KEY"; exit 1; }
          [ -n "$CODEX_IMAGE_KEY" ] || { echo "::error::缺 CODEX_IMAGE_KEY"; exit 1; }

      - name: 產出今日日記
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
        run: python scripts/publish_entry.py

      - name: 提交
        run: |
          git config user.name "yori-cloud"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "今天沒有新內容"; exit 0; }
          day=$(python -c "import json;print(json.load(open('docs/entries.json'))[-1]['label'])")
          git commit -m "diary: ${day}（雲端自動續更）"
          git push
