name: 優理每日日記

on:
  schedule:
    - cron: '30 13 * * *'   # 台北 21:30 每天一篇
  workflow_dispatch:
    inputs:
      force:
        description: '強制發（忽略同日已發過的防呆，測試用）'
        type: boolean
        default: false
      dry_run:
        description: '只試跑：稿與圖存成 artifact，不發佈'
        type: boolean
        default: false
      larch_only:
        description: '只同步到 Larch，不產新日記'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-entry
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: 裝相依
        run: pip install --quiet Pillow numpy

      - name: 確認金鑰
        if: github.event.inputs.larch_only != 'true'
        env:
          LLMSHARE_API_KEY: ${{ secrets.LLMSHARE_API_KEY }}
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$LLMSHARE_API_KEY" ] || { echo "::error::缺 LLMSHARE_API_KEY"; exit 1; }
          [ -n "$CODEX_IMAGE_KEY" ] || { echo "::error::缺 CODEX_IMAGE_KEY"; exit 1; }
          [ -n "$GEMINI_API_KEY" ] || echo "::warning::缺 GEMINI_API_KEY，今天不看新聞，自由發揮"

      - name: 產出今日日記
        if: github.event.inputs.larch_only != 'true'
        env:
          LLMSHARE_API_KEY: ${{ secrets.LLMSHARE_API_KEY }}
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          FORCE_TODAY: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python scripts/publish_entry.py

      - name: 試跑結果
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dry-run
          path: drafts/dry-run/

      - name: 提交
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.larch_only != 'true'
        run: |
          git config user.name "yori-cloud"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "今天沒有新內容"; exit 0; }
          day=$(python -c "import json;print(json.load(open('docs/entries.json'))[-1]['label'])")
          git commit -m "diary: ${day}（雲端自動續更）"
          git push

      - name: 同步到 Larch
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          LARCH_AGENT_KEY: ${{ secrets.LARCH_AGENT_KEY }}
          LLMSHARE_API_KEY: ${{ secrets.LLMSHARE_API_KEY }}
        run: |
          [ -n "$LARCH_AGENT_KEY" ] || { echo "::warning::缺 LARCH_AGENT_KEY，今天不同步 Larch"; exit 0; }
          git config user.name "yori-cloud"
          git config user.email "actions@users.noreply.github.com"
          # 先產背景、挑格子與表情並推上去，卡片讀的是 GitHub Pages 上的背景
          python scripts/larch_yori.py --dry-run
          git add -- docs/larch/bg docs/larch/thumbs larch/faces larch/titles.json
          if ! git diff --cached --quiet; then
            git commit -m "larch: $(TZ=Asia/Taipei date +%F) 同步"
            git push
            # 等 GitHub Pages 部署好剛推的圖再同步，不然卡片指到的新背景會有一兩分鐘是 404
            f=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- docs/larch | head -1)
            for i in $(seq 1 40); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' "https://yazelin.github.io/yori-growth-log/${f#docs/}")" = 200 ] && break
              sleep 15
            done
          fi
          python scripts/larch_yori.py || { echo "::warning::Larch 同步失敗，下一班會自動補上"; exit 1; }
